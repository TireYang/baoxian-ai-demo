<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%237c5cff'/%3E%3Cpath d='M28 12c1.2 7.5 3.5 10.3 11 12-7.5 1.7-9.8 4.5-11 12-1.2-7.5-3.5-10.3-11-12 7.5-1.7 9.8-4.5 11-12z' fill='%23fff'/%3E%3C/svg%3E">
<title>保E通 AI · AI Native 保险中介操作系统（演示）</title>
<style>
:root{
  --bg:#f4f5fa; --surface:#fff; --text:#111827; --sub:#5b6478; --muted:#8a93a6;
  --line:#e8ebf3; --line-2:#f1f3f9;
  --ai:#6d4aff; --ai-2:#a855f7; --ai-d:#4c2fd6; --ai-soft:#f4f1ff; --ai-line:#e2daff;
  --ok:#12b76a; --warn:#f79009; --bad:#f04438; --info:#2e90fa;
  --sidebar-w:250px; --top-h:62px; --copilot-w:392px;
  --r:14px; --sh:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.05);
  --sh-2:0 12px 28px rgba(16,24,40,.10);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;min-width:1240px;
}
::selection{background:rgba(109,74,255,.16)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#d3d8e6;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#bcc3d6}
::-webkit-scrollbar-track{background:transparent}
button,input,select,textarea{font-family:inherit}

/* ============ 布局 ============ */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-w);position:fixed;inset:0 auto 0 0;z-index:40;
  background:linear-gradient(185deg,#0b1022,#141a3c 52%,#0d1226);color:#aab2d0;
  display:flex;flex-direction:column;
}
.logo{padding:17px 18px 15px;display:flex;gap:11px;align-items:center;border-bottom:1px solid rgba(255,255,255,.07)}
.logo-mark{
  width:38px;height:38px;border-radius:11px;flex:none;position:relative;
  background:linear-gradient(135deg,#6d4aff,#a855f7);display:flex;align-items:center;justify-content:center;
  font-weight:800;color:#fff;font-size:16px;box-shadow:0 6px 16px rgba(109,74,255,.45);
}
.logo-mark em{position:absolute;right:-2px;bottom:-2px;width:13px;height:13px;border-radius:50%;background:#12b76a;border:2.5px solid #0d1226}
.logo-t b{color:#fff;font-size:16px;letter-spacing:.4px;display:block}
.logo-t span{font-size:10.5px;color:#7c86ad;letter-spacing:.3px}
.kbd-hint{
  margin:12px 14px 4px;padding:9px 11px;border-radius:9px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.07);font-size:11.5px;color:#8d97bd;cursor:pointer;
  display:flex;align-items:center;gap:8px;transition:.16s;
}
.kbd-hint:hover{background:rgba(109,74,255,.22);color:#fff;border-color:rgba(109,74,255,.5)}
kbd{font-family:var(--mono);font-size:10.5px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);border-radius:4px;padding:1px 5px;color:#c7cde6}
.menu{padding:8px 11px 18px;flex:1;overflow-y:auto}
.menu::-webkit-scrollbar{width:5px}
.menu::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16)}
.menu-group{font-size:10.5px;color:#5f6a93;padding:14px 12px 6px;letter-spacing:1.2px}
.menu-item{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:#aab2d0;
  cursor:pointer;margin-bottom:2px;font-size:13.5px;transition:.16s;position:relative;
}
.menu-item svg{width:17px;height:17px;flex:none;opacity:.8}
.menu-item:hover{background:rgba(255,255,255,.07);color:#fff}
.menu-item.active{background:linear-gradient(90deg,rgba(109,74,255,.38),rgba(168,85,247,.18));color:#fff;font-weight:600}
.menu-item.active::before{content:'';position:absolute;left:-11px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:#a78bfa}
.menu-item .n{margin-left:auto;font-size:10.5px;background:rgba(240,68,56,.9);color:#fff;border-radius:9px;padding:1px 6px;font-weight:600}
.menu-item .n.ai{background:rgba(109,74,255,.85)}
.side-foot{padding:12px 18px 14px;font-size:10.5px;color:#5f6a93;border-top:1px solid rgba(255,255,255,.07);line-height:1.9}
.live{display:flex;align-items:center;gap:6px;color:#4ade80;font-weight:600}
.pulse{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.7);animation:pl 1.9s infinite}
@keyframes pl{70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.main{margin-left:var(--sidebar-w);flex:1;min-width:0;transition:margin-right .26s}
.main.copilot-open{margin-right:var(--copilot-w)}

/* ============ 顶栏 ============ */
.topbar{
  height:var(--top-h);background:rgba(255,255,255,.88);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;
  position:sticky;top:0;z-index:30;
}
.crumbs{color:var(--muted);font-size:13px;white-space:nowrap}
.crumbs b{color:var(--text);font-weight:600}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.cmdbar{
  display:flex;align-items:center;gap:9px;height:36px;padding:0 12px;border-radius:18px;cursor:pointer;
  background:linear-gradient(90deg,#f6f4ff,#fdf5ff);border:1px solid var(--ai-line);
  min-width:330px;color:#6b5ba8;font-size:12.5px;transition:.18s;
}
.cmdbar:hover{border-color:var(--ai);box-shadow:0 0 0 3px rgba(109,74,255,.10)}
.cmdbar svg{width:15px;height:15px;flex:none}
.cmdbar .txt{flex:1;color:#8b86a8}
.pill{
  display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;
  background:#fff5f4;border:1px solid #ffd9d5;color:#c9372c;font-size:12.5px;font-weight:600;cursor:pointer;transition:.16s;
}
.pill:hover{background:#ffe9e6}
.pill.alt{background:var(--ai-soft);border-color:var(--ai-line);color:var(--ai-d)}
.ic-btn{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;color:#5b6478;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.16s;
}
.ic-btn:hover{border-color:var(--ai);color:var(--ai);background:var(--ai-soft)}
.ic-btn.on{background:var(--ai);border-color:var(--ai);color:#fff}
.user{display:flex;align-items:center;gap:9px;cursor:pointer;padding:4px 8px;border-radius:10px;transition:.16s}
.user:hover{background:#f4f5fa}
.avatar{width:32px;height:32px;border-radius:50%;flex:none;color:#fff;background:linear-gradient(135deg,#6d4aff,#a855f7);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.user .name{font-size:12.5px;font-weight:600;line-height:1.3}
.user .role{font-size:10.5px;color:var(--muted);line-height:1.2}

/* ============ 内容区 ============ */
.content{padding:20px 22px 46px;max-width:1500px}
#view>*{animation:fade .28s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:15px;flex-wrap:wrap}
.page-head h2{font-size:19px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:9px}
.page-head p{color:var(--sub);font-size:12.5px;margin-top:5px;line-height:1.6}
.ph-r{display:flex;gap:9px;align-items:center}

/* ============ 卡片 ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{padding:14px 17px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-h h3{font-size:14px;font-weight:650;display:flex;align-items:center;gap:7px}
.card-b{padding:13px 17px 17px}
.hint{font-size:11.5px;color:var(--muted);font-weight:400}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1280px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g2e,.g3{grid-template-columns:minmax(0,1fr)}}

/* ============ KPI ============ */
.kpi{padding:16px;display:flex;gap:13px;align-items:flex-start;position:relative;overflow:hidden;transition:.2s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.kpi::after{content:'';position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(109,74,255,.10),transparent 70%)}
.kpi-ic{width:40px;height:40px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center}
.kpi-ic svg{width:20px;height:20px}
.bg-ai{background:var(--ai-soft);color:var(--ai)}
.bg-ok{background:#e9f9f1;color:#0e9f5f}
.bg-warn{background:#fff5e8;color:#e07b00}
.bg-bad{background:#fef1f0;color:#e0342a}
.bg-info{background:#eaf4ff;color:#1570ef}
.kpi .l{font-size:12px;color:var(--sub)}
.kpi .v{font-size:23px;font-weight:750;margin:4px 0 6px;letter-spacing:.2px;font-variant-numeric:tabular-nums}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:10px}
.delta.good{background:#e9f9f1;color:#0e9f5f}
.delta.bad{background:#fef1f0;color:#e0342a}
.delta.neu{background:#f2f4f8;color:#5b6478}

/* ============ AI 徽标 ============ */
.ai-badge{
  display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.4px;
  padding:2.5px 8px;border-radius:6px;background:linear-gradient(90deg,#6d4aff,#a855f7);color:#fff;white-space:nowrap;
}
.ai-badge.ghost{background:var(--ai-soft);color:var(--ai-d);border:1px solid var(--ai-line)}
.chip-ai{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px;border-radius:20px;
  background:var(--ai-soft);color:var(--ai-d);border:1px solid var(--ai-line);white-space:nowrap;
}
.conf{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--sub);white-space:nowrap}
.conf .bar{width:44px;height:5px;border-radius:3px;background:#eceff5;overflow:hidden}
.conf .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#6d4aff,#a855f7)}
.conf.hi .bar i{background:linear-gradient(90deg,#12b76a,#34d399)}
.conf.lo .bar i{background:linear-gradient(90deg,#f79009,#f04438)}

/* ============ 表格 ============ */
table{width:100%;border-collapse:collapse}
th{background:#f8f9fd;color:#6b7280;font-weight:550;text-align:left;padding:9px 13px;font-size:12px;white-space:nowrap}
td{padding:11px 13px;border-top:1px solid var(--line-2);font-size:12.5px;vertical-align:middle}
tbody tr{transition:.14s}
.tbl-hover tbody tr:hover{background:#fafaff}
tr.clickable{cursor:pointer}
.table-wrap{overflow-x:auto}
.num{font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--muted);padding:28px!important}
.mini th{padding:7px 9px;font-size:11.5px}
.mini td{padding:8px 9px;font-size:12px}
.mono{font-family:var(--mono);font-size:11.5px}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;line-height:17px;white-space:nowrap}
.b-green{background:#e9f9f1;color:#0e9f5f}
.b-red{background:#fef1f0;color:#e0342a}
.b-blue{background:#eaf4ff;color:#1570ef}
.b-gray{background:#f2f4f8;color:#5b6478}
.b-orange{background:#fff5e8;color:#e07b00}
.b-ai{background:var(--ai-soft);color:var(--ai-d)}
.b-dark{background:#eceef4;color:#454f63}

/* ============ 按钮 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;
  border-radius:9px;border:1px solid transparent;font-size:12.5px;cursor:pointer;transition:.16s;white-space:nowrap;font-weight:500;
}
.btn-p{background:linear-gradient(135deg,#6d4aff,#8b5cf6);color:#fff;box-shadow:0 3px 10px rgba(109,74,255,.28)}
.btn-p:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 6px 16px rgba(109,74,255,.34)}
.btn-g{background:#fff;border-color:#dde1ea;color:#3d4657}
.btn-g:hover{border-color:var(--ai);color:var(--ai)}
.btn-ok{background:#0e9f5f;color:#fff}
.btn-ok:hover{filter:brightness(1.07)}
.btn-bad{background:#fff;border-color:#ffd9d5;color:#c9372c}
.btn-bad:hover{background:#fff5f4}
.btn-sm{height:28px;padding:0 10px;font-size:11.5px;border-radius:7px}
.btn-xs{height:24px;padding:0 8px;font-size:11px;border-radius:6px}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.55;cursor:default;transform:none!important;box-shadow:none!important}
.btn-ai-ghost{background:var(--ai-soft);border-color:var(--ai-line);color:var(--ai-d)}
.btn-ai-ghost:hover{background:#ebe4ff}

/* ============ 筛选 / chips ============ */
.filter-bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:13px}
.inp,.sel{height:34px;border:1px solid #dde1ea;border-radius:9px;padding:0 11px;font-size:12.5px;outline:none;background:#fff;color:#3d4657;transition:.15s}
.sel{cursor:pointer}
.inp:focus,.sel:focus{border-color:var(--ai);box-shadow:0 0 0 3px rgba(109,74,255,.12)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:6px 13px;border-radius:18px;background:#fff;border:1px solid #dde1ea;font-size:12px;cursor:pointer;color:#4b5563;transition:.15s}
.chip:hover{border-color:var(--ai);color:var(--ai)}
.chip.on{background:var(--ai);border-color:var(--ai);color:#fff;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{padding:9px 14px;font-size:13px;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;transition:.15s;font-weight:500}
.tab:hover{color:var(--ai)}
.tab.on{color:var(--ai-d);border-bottom-color:var(--ai);font-weight:650}

/* ============ Agent 舰队 ============ */
.fleet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
@media(max-width:1280px){.fleet{grid-template-columns:repeat(2,minmax(0,1fr))}}
.acard{padding:14px;position:relative;overflow:hidden;cursor:pointer;transition:.2s}
.acard:hover{transform:translateY(-2px);box-shadow:var(--sh-2);border-color:var(--ai-line)}
.acard .top{display:flex;align-items:center;gap:10px}
.aface{width:38px;height:38px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;position:relative}
.aface .st{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;border:2.5px solid #fff;background:#12b76a}
.aface .st.idle{background:#c3c9d4}
.aface .st.hitl{background:#f79009}
.acard .nm{font-size:13.5px;font-weight:650}
.acard .sk{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5}
.acard .row{display:flex;gap:14px;margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
.acard .row div{flex:1}
.acard .row .k{font-size:10.5px;color:var(--muted)}
.acard .row .v{font-size:15px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.aflash{position:absolute;inset:0;background:radial-gradient(circle at 80% 0%,rgba(109,74,255,.10),transparent 60%);pointer-events:none}

/* ============ 执行流 ============ */
.feed{max-height:352px;overflow-y:auto;padding-right:4px}
.feed-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line-2);animation:slideIn .3s}
@keyframes slideIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.feed-item:last-child{border-bottom:none}
.feed-ic{width:22px;height:22px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:700}
.feed-x{flex:1;font-size:12.5px;line-height:1.6}
.feed-t{font-size:10.5px;color:var(--muted);font-family:var(--mono);margin-top:2px}

/* ============ 例外队列 ============ */
.exc{border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:11px;padding:12px 13px;margin-bottom:10px;background:#fff;transition:.18s}
.exc:hover{box-shadow:var(--sh-2)}
.exc.hi{border-left-color:var(--bad)}
.exc.ok{border-left-color:var(--ok);opacity:.72}
.exc .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.exc .t{font-size:13px;font-weight:650}
.exc .r{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.65}
.exc .ai-sug{margin-top:8px;padding:9px 11px;border-radius:9px;background:var(--ai-soft);border:1px solid var(--ai-line);font-size:12px;line-height:1.7;color:#4a3f7a}
.exc .f{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}

/* ============ Agent 轨迹（思考链） ============ */
.trace{border:1px solid var(--line);border-radius:11px;background:#fbfbfe;padding:12px;margin-top:10px}
.step{display:flex;gap:10px;padding:8px 0;position:relative;animation:slideIn .3s}
.step:not(:last-child)::before{content:'';position:absolute;left:11px;top:30px;bottom:-2px;width:2px;background:var(--line)}
.step-ic{width:23px;height:23px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#fff;z-index:1}
.st-think{background:linear-gradient(135deg,#6d4aff,#a855f7)}
.st-tool{background:linear-gradient(135deg,#2e90fa,#06b6d4)}
.st-obs{background:linear-gradient(135deg,#12b76a,#34d399)}
.st-out{background:linear-gradient(135deg,#f79009,#fbbf24)}
.st-hitl{background:linear-gradient(135deg,#f04438,#fb7185)}
.step-b{flex:1;min-width:0}
.step-b .st-t{font-size:12.5px;font-weight:600}
.step-b .st-d{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.7}
.tool-card{
  margin-top:6px;border:1px solid #d7e5fb;background:#f6faff;border-radius:8px;padding:8px 10px;
  font-family:var(--mono);font-size:11px;color:#1c5fa8;white-space:pre-wrap;word-break:break-all;line-height:1.6;
}
.out-card{margin-top:6px;border:1px solid var(--ai-line);background:#fff;border-radius:9px;padding:10px 11px;font-size:12px;line-height:1.75}
.shimmer{background:linear-gradient(90deg,#eceff5 25%,#f7f8fc 37%,#eceff5 63%);background-size:400% 100%;animation:sh 1.3s infinite;border-radius:6px;height:11px;margin:6px 0}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ============ Copilot ============ */
.copilot{
  position:fixed;top:0;right:0;bottom:0;width:var(--copilot-w);background:#fff;border-left:1px solid var(--line);
  z-index:60;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .26s cubic-bezier(.4,0,.2,1);
  box-shadow:-10px 0 30px rgba(16,24,40,.08);
}
.copilot.show{transform:none}
.cp-h{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.cp-h .t{flex:1}
.cp-h b{font-size:13.5px;display:block}
.cp-h span{font-size:11px;color:var(--muted)}
.cp-b{flex:1;overflow-y:auto;padding:14px 15px;background:linear-gradient(180deg,#fcfbff,#fff 200px)}
.cp-f{border-top:1px solid var(--line);padding:11px 13px}
.cp-in{display:flex;gap:8px;align-items:flex-end}
.cp-in textarea{
  flex:1;border:1px solid #dde1ea;border-radius:11px;padding:9px 11px;font-size:12.5px;resize:none;height:62px;
  outline:none;line-height:1.6;transition:.15s;
}
.cp-in textarea:focus{border-color:var(--ai);box-shadow:0 0 0 3px rgba(109,74,255,.12)}
.msg{display:flex;gap:9px;margin-bottom:13px;animation:fade .25s}
.msg .av{width:26px;height:26px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.msg.u .av{background:#454f63}
.msg.a .av{background:linear-gradient(135deg,#6d4aff,#a855f7)}
.msg .bd{flex:1;min-width:0}
.bubble{background:#f5f6fa;border-radius:11px;padding:9px 12px;font-size:12.5px;line-height:1.75}
.msg.a .bubble{background:#fff;border:1px solid var(--line)}
.quick{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.quick button{
  text-align:left;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12px;
  cursor:pointer;color:#3d4657;transition:.15s;line-height:1.5;
}
.quick button:hover{border-color:var(--ai);background:var(--ai-soft);color:var(--ai-d)}
.approve-card{border:1px solid #ffe0b2;background:#fffaf0;border-radius:10px;padding:10px 11px;margin-top:8px}
.approve-card .t{font-size:12.5px;font-weight:650;color:#b45309}
.approve-card .d{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.65}
.approve-card .f{display:flex;gap:7px;margin-top:8px}

/* ============ 指令中枢 ============ */
.cmdk{position:fixed;inset:0;z-index:90;background:rgba(15,23,42,.42);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;padding-top:11vh}
.cmdk.show{display:flex}
.cmdk-box{width:620px;max-width:94vw;background:#fff;border-radius:15px;box-shadow:0 24px 60px rgba(16,24,40,.28);overflow:hidden;animation:pop .2s}
@keyframes pop{from{transform:scale(.97) translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.cmdk-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cmdk-in input{flex:1;border:none;outline:none;font-size:15px}
.cmdk-list{max-height:52vh;overflow-y:auto;padding:8px}
.cmdk-g{font-size:10.5px;color:var(--muted);padding:9px 10px 5px;letter-spacing:1px}
.cmdk-i{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:10px;cursor:pointer;font-size:13px;transition:.13s}
.cmdk-i:hover,.cmdk-i.on{background:var(--ai-soft)}
.cmdk-i .ic{width:26px;height:26px;border-radius:8px;background:#f2f4f8;display:flex;align-items:center;justify-content:center;flex:none}
.cmdk-i .sub{font-size:11px;color:var(--muted);margin-left:auto}

/* ============ 抽屉 / 弹窗 / Toast ============ */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.42);opacity:0;pointer-events:none;transition:.24s;z-index:65}
.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:520px;max-width:94vw;background:#fff;z-index:75;transform:translateX(104%);transition:transform .27s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(16,24,40,.14)}
.drawer.show{transform:none}
.drawer-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.drawer-title{font-size:15px;font-weight:700;line-height:1.5}
.drawer-b{padding:16px 18px;overflow-y:auto;flex:1}
.drawer-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.x-btn{width:29px;height:29px;border-radius:8px;border:none;background:#f2f4f8;color:#5b6478;cursor:pointer;font-size:13px;transition:.15s;flex:none}
.x-btn:hover{background:#e7e9f2}
.sec-t{font-size:13px;font-weight:650;margin:18px 0 10px;display:flex;align-items:center;gap:7px}
.sec-t::before{content:'';width:3px;height:13px;border-radius:2px;background:var(--ai)}
.sec-t .hint{margin-left:auto}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.info-grid .k{color:var(--muted);font-size:11.5px;margin-bottom:2px}
.info-grid .it{font-size:12.5px;line-height:1.5}
.tl{position:relative;padding-left:19px}
.tl::before{content:'';position:absolute;left:5px;top:7px;bottom:7px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:15px}
.tl-item::before{content:'';position:absolute;left:-19px;top:4px;width:9px;height:9px;border-radius:50%;background:#fff;border:2.5px solid var(--ai)}
.tl-date{font-size:11.5px;color:var(--muted)}
.tl-x{font-size:12.5px;margin-top:3px;line-height:1.65}
.modal-wrap{position:fixed;inset:0;z-index:85;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.42);padding:20px}
.modal-wrap.show{display:flex}
.modal{width:560px;max-width:94vw;max-height:88vh;overflow-y:auto;animation:pop .22s}
.modal-h{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-h h3{font-size:14.5px}
.modal-b{padding:16px 18px}
.modal-f{padding:13px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;font-size:11.5px;color:var(--sub);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;height:35px;border:1px solid #dde1ea;border-radius:9px;padding:0 10px;font-size:12.5px;outline:none;color:#3d4657;background:#fff}
.field textarea{height:auto;padding:8px 10px;line-height:1.6;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ai);box-shadow:0 0 0 3px rgba(109,74,255,.12)}
#toast-root{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 16px;font-size:12.5px;box-shadow:0 10px 28px rgba(16,24,40,.16);animation:tin .26s;max-width:520px}
.toast.out{animation:tout .3s forwards}
@keyframes tin{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
.t-ic{width:17px;height:17px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:700}
.t-success .t-ic{background:#12b76a}.t-info .t-ic{background:#2e90fa}.t-warn .t-ic{background:#f79009}.t-ai .t-ic{background:linear-gradient(135deg,#6d4aff,#a855f7)}

/* ============ 图表 ============ */
.bars{display:flex;align-items:flex-end;gap:14px;height:200px;padding-top:22px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bars .b{width:100%;max-width:46px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#8b5cf6,#6d4aff);position:relative;transition:.25s}
.bars .b.ai{background:linear-gradient(180deg,#c4b5fd,#a855f7)}
.bars .b span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:650;white-space:nowrap}
.bars .b:hover{filter:brightness(1.08)}
.bars .nm{font-size:11px;color:var(--sub);margin-top:7px;text-align:center}
.donut{width:150px;height:150px;border-radius:50%;position:relative;flex:none}
.donut::after{content:'';position:absolute;inset:26px;background:#fff;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line-2)}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1}
.donut .c b{font-size:19px}
.donut .c span{font-size:11px;color:var(--muted);margin-top:2px}
.legend{display:flex;flex-direction:column;gap:8px;font-size:12px;flex:1;min-width:140px}
.legend .li{display:flex;align-items:center;gap:8px}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}
.legend .pct{margin-left:auto;color:var(--sub)}
.hbar{margin-bottom:11px}
.hbar .h{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.hbar .track{height:11px;border-radius:6px;background:#f0f2f7;overflow:hidden}
.hbar .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#8b5cf6,#6d4aff);transition:width .6s}
.progress{height:7px;border-radius:4px;background:#eef0f5;overflow:hidden}
.progress i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#6d4aff,#a855f7);transition:width .5s}
.score{display:flex;align-items:center;gap:8px}
.score .track{width:60px;height:6px;border-radius:3px;background:#eef0f5;overflow:hidden;flex:none}
.score .fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#6d4aff,#a855f7)}
.score .fill.hot{background:linear-gradient(90deg,#f04438,#f79009)}
.score .fill.cold{background:#c3c9d4}

/* ============ 输液/流水线（理赔） ============ */
.pipe{display:flex;gap:0;align-items:stretch;flex-wrap:wrap}
.pipe .st{flex:1;min-width:118px;padding:11px 10px;border:1px solid var(--line);border-right:none;background:#fff;position:relative}
.pipe .st:first-child{border-radius:10px 0 0 10px}
.pipe .st:last-child{border-right:1px solid var(--line);border-radius:0 10px 10px 0}
.pipe .st.done{background:#f2fdf7;border-color:#c9efdb}
.pipe .st.run{background:var(--ai-soft);border-color:var(--ai-line)}
.pipe .st .n{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.pipe .st .t{font-size:12px;font-weight:600;margin-top:3px}
.pipe .st .r{font-size:11px;color:var(--sub);margin-top:3px;line-height:1.5}
.pipe .st .dot{position:absolute;right:9px;top:9px;width:8px;height:8px;border-radius:50%;background:#d7dbe6}
.pipe .st.done .dot{background:#12b76a}
.pipe .st.run .dot{background:var(--ai);box-shadow:0 0 0 4px rgba(109,74,255,.18);animation:pl 1.6s infinite}

/* ============ 雷达图 ============ */
.radar-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.radar-wrap svg{flex:none}
.gap-legend{display:flex;flex-direction:column;gap:9px;flex:1;min-width:190px}
.gap-legend .li{font-size:12px;display:flex;align-items:center;gap:8px}
.gap-legend .li .pct{margin-left:auto;font-weight:650;color:#e0342a;font-variant-numeric:tabular-nums}
.gap-legend .li.ok .pct{color:#0e9f5f}

/* ============ 条款引用 ============ */
.cite{border-left:3px solid var(--ai);background:#faf9ff;border-radius:0 8px 8px 0;padding:8px 11px;font-size:11.5px;color:#5b55a0;margin-top:7px;line-height:1.7;font-family:var(--mono)}
.guard{display:flex;gap:8px;align-items:flex-start;background:#fff8f0;border:1px solid #ffe0b2;border-radius:9px;padding:9px 11px;font-size:11.5px;color:#8a5300;line-height:1.65;margin-top:8px}

/* ============ 滑块 ============ */
.slider{-webkit-appearance:none;width:100%;height:6px;border-radius:3px;background:#eaeef7;outline:none;margin:8px 0}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#6d4aff,#a855f7);cursor:pointer;box-shadow:0 2px 8px rgba(109,74,255,.5)}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;border-bottom:1px dashed var(--line-2)}
.kv:last-child{border-bottom:none}
.kv b{font-variant-numeric:tabular-nums}
.kv.big{font-size:14px;padding-top:10px}
.kv.big b{font-size:17px;color:var(--ai-d)}

/* ============ 手机版预览按钮 + 真机框 ============ */
.preview-btn{
  display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:9px;
  border:1px solid var(--line);background:#fff;font-size:12.5px;color:#3d4657;cursor:pointer;transition:.16s;white-space:nowrap;
}
.preview-btn:hover{border-color:var(--ai);color:var(--ai);background:var(--ai-soft)}
.phone-wrap{display:flex;gap:26px;align-items:center;background:#fff;border-radius:20px;padding:26px;box-shadow:0 24px 60px rgba(16,24,40,.28);position:relative;max-width:940px}
.phone-side{width:310px}
.phone-side h3{font-size:16px;margin-bottom:10px}
.phone-side p{font-size:12.5px;color:var(--sub);line-height:1.85}
.phone-tips{margin:14px 0;display:flex;flex-direction:column;gap:9px;font-size:12px;color:#3d4657;line-height:1.65}
.phone-tips b{color:var(--ai-d)}
.phone-frame{width:390px;height:min(812px,80vh);border-radius:44px;background:#0b1022;padding:11px;position:relative;box-shadow:0 20px 50px rgba(16,24,40,.35);flex:none}
.phone-frame iframe{width:100%;height:100%;border:none;border-radius:34px;background:#fff;display:block}
.phone-notch{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:104px;height:22px;border-radius:12px;background:#0b1022;z-index:3;pointer-events:none}
.phone-x{position:absolute;top:14px;right:14px}

/* ============ 手机端组件（m-mode）============ */
.mtop,.mtabs,.m-fab{display:none}
.mtop{display:none;position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 14px 9px}
.mtop-row{display:flex;align-items:center;gap:10px}
.m-brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.m-brand b{font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-mark{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,#6d4aff,#a855f7);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:none}
.m-right{display:flex;align-items:center;gap:9px}
.m-live{display:flex;align-items:center;gap:5px;font-size:10.5px;color:#0e9f5f;background:#f0fdf6;border:1px solid #c9efdb;border-radius:12px;padding:3px 8px;white-space:nowrap}
.m-avatar{width:30px;height:30px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6d4aff,#a855f7);flex:none}
.m-search{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;margin-top:10px;border-radius:20px;background:linear-gradient(90deg,#f6f4ff,#fdf5ff);border:1px solid var(--ai-line);color:#8b86a8;font-size:12.5px}
.m-search span{flex:1}
.m-search em{font-style:normal;font-size:10px;color:#a99fd6;border:1px solid var(--ai-line);border-radius:5px;padding:1px 5px;background:#fff}
.mtabs{position:fixed;left:0;right:0;bottom:0;z-index:70;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.mtab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;font-size:10.5px;color:#8a93a6;cursor:pointer;border-radius:10px;position:relative;transition:.15s}
.mtab svg{width:20px;height:20px}
.mtab.on{color:var(--ai-d);font-weight:650}
.mtab.on svg{filter:drop-shadow(0 2px 6px rgba(109,74,255,.35))}
.mdot{position:absolute;top:1px;right:calc(50% - 20px);min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:#f04438;color:#fff;font-size:9.5px;font-style:normal;display:flex;align-items:center;justify-content:center;font-weight:700}
.m-fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#6d4aff,#a855f7);align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(109,74,255,.45);z-index:71;cursor:pointer}
.m-fab:active{transform:scale(.94)}
.mcard{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px 13px;margin-bottom:10px;box-shadow:var(--sh)}
.mcard.tap{cursor:pointer}
.mcard.tap:active{transform:scale(.995);background:#fafaff}
.mcard .mh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mcard .mt{font-size:14.5px;font-weight:650}
.mcard .msub{font-size:11.5px;color:var(--muted)}
.mcard .mact{display:flex;gap:8px;margin-top:11px}
.mcard .mact .btn{flex:1;height:37px;font-size:12.5px}
.mkv{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:6px 0;border-bottom:1px dashed var(--line-2);line-height:1.6}
.mkv:last-child{border-bottom:none}
.mkv .k{color:var(--muted);flex:none}
.mkv .v{text-align:right}
.mstrip{display:flex;gap:9px;overflow-x:auto;margin:0 -14px 12px;padding:2px 14px 8px;scrollbar-width:none}
.mstrip::-webkit-scrollbar{display:none}
.mstrip .mstat{flex:none;min-width:138px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px;box-shadow:var(--sh)}
.mstrip .mstat .l{font-size:11px;color:var(--sub)}
.mstrip .mstat .v{font-size:18px;font-weight:750;margin-top:4px;font-variant-numeric:tabular-nums}
.msec{font-size:13px;font-weight:650;margin:16px 2px 9px;display:flex;align-items:center;gap:7px}
.msec::before{content:'';width:3px;height:13px;border-radius:2px;background:var(--ai)}
.msec .hint{margin-left:auto;font-weight:400}
.mrow{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line-2);cursor:pointer;font-size:13px}
.mrow .mic{width:32px;height:32px;border-radius:10px;background:var(--ai-soft);color:var(--ai);display:flex;align-items:center;justify-content:center;flex:none}
.mrow .mic svg{width:17px;height:17px}
.mrow b{display:block;font-size:13px}
.mblock{padding:7px 0;border-bottom:1px dashed var(--line-2)}
.mblock:last-child{border-bottom:none}
.mblock .k{font-size:11.5px;color:var(--muted)}
.mblock .v{font-size:12.5px;margin-top:4px;line-height:1.65;color:#3d4657}
.mrow .hint{display:block;margin-top:2px;line-height:1.55}
.m-q{display:flex;gap:8px;overflow-x:auto;margin:0 -14px 12px;padding:2px 14px 8px;scrollbar-width:none}
.m-q::-webkit-scrollbar{display:none}
.m-q .chip{flex:none}
.m-step{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line-2)}
.m-step .n{width:24px;height:24px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;background:linear-gradient(135deg,#6d4aff,#a855f7)}
.m-step.wait .n{background:#d7dbe6}
.m-step.done .n{background:#12b76a}
.m-step .b{flex:1;min-width:0}
.m-step .b b{font-size:12.5px}
.m-step .b .d{font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.6}

/* ============ m-mode 覆盖 ============ */
body.m-mode{min-width:0;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));background:#f4f5fa}
body.m-mode .sidebar,body.m-mode .topbar{display:none!important}
body.m-mode .main{margin:0!important;padding-top:var(--mtop-h,100px)}
body.m-mode .content{padding:13px 14px 26px;max-width:none}
body.m-mode .grid{grid-template-columns:minmax(0,1fr)!important;gap:11px}
body.m-mode .page-head{flex-direction:column;align-items:stretch;gap:9px;margin-bottom:12px}
body.m-mode .page-head h2{font-size:17.5px}
body.m-mode .page-head p{font-size:12px;margin-top:4px}
body.m-mode .ph-r{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
body.m-mode .ph-r::-webkit-scrollbar{display:none}
body.m-mode .ph-r .btn,body.m-mode .ph-r .chip-ai{flex:none}
body.m-mode .card{border-radius:15px}
body.m-mode .card-h{padding:13px 14px 0}
body.m-mode .card-b{padding:11px 14px 14px}
body.m-mode .kpi .v{font-size:21px}
body.m-mode .fleet{grid-template-columns:minmax(0,1fr)!important}
body.m-mode .acard .row .v{font-size:14px}
body.m-mode .bars{height:170px}
body.m-mode .donut{width:132px;height:132px}
body.m-mode .pipe{flex-wrap:nowrap;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
body.m-mode .pipe::-webkit-scrollbar{display:none}
body.m-mode .pipe .st{min-width:142px}
body.m-mode .drawer{width:100%;max-width:100%;border-radius:0}
body.m-mode .modal{width:100%;max-width:100%;border-radius:16px}

function toast(msg, type){
  type = type || 'success';
  const glyph = {success:'✓', info:'i', warn:'!', ai:'✦'}[type] || '✓';
  const el = document.createElement('div');
  el.className = 'toast t-' + type;
  el.innerHTML = '<span class="t-ic">' + glyph + '</span><span>' + esc(msg) + '</span>';
  $('#toast-root').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 2800);
}
function badge(t, c){ return '<span class="badge ' + c + '">' + esc(t) + '</span>'; }
function conf(v, label){
  const cls = v >= .88 ? 'hi' : v < .7 ? 'lo' : '';
  return '<span class="conf ' + cls + '"><span class="bar"><i style="width:' + Math.round(v*100) + '%"></i></span>' +
    (label === false ? '' : pct(v)) + '</span>';
}
function aiTag(t){ return '<span class="ai-badge">✦ ' + esc(t) + '</span>'; }
function aiGhost(t){ return '<span class="ai-badge ghost">✦ ' + esc(t) + '</span>'; }
function head(t, d, extra){
  return '<div class="page-head"><div><h2>' + t + '</h2><p>' + d + '</p></div><div class="ph-r">' + (extra || '') + '</div></div>';
}
function kpi(cls, ic, label, value, delta, dcls){
  return '<div class="card kpi"><div class="kpi-ic ' + cls + '">' + ic + '</div><div style="flex:1">' +
    '<div class="l">' + label + '</div><div class="v num">' + value + '</div>' +
    '<span class="delta ' + dcls + '">' + delta + '</span></div></div>';
}
function hbars(rows, unit){
  return rows.map(r => {
    const max = Math.max.apply(null, rows.map(x => x[1]));
    return '<div class="hbar"><div class="h"><span>' + esc(r[0]) + '</span><b class="num">' + num(r[1]) + ' ' + (unit || '') + '</b></div>' +
      '<div class="track"><div class="fill" style="width:' + (r[1] / max * 100).toFixed(1) + '%"></div></div></div>';
  }).join('');
}
function donut(segs, center){
  let acc = 0;
  const parts = segs.map(s => { const f = acc; acc += s.v; return s.c + ' ' + f + '% ' + acc + '%'; }).join(',');
  const top = segs.slice().sort((a, b) => b.v - a.v)[0];
  const c = center || (top.v + '%');
  return '<div class="donut" style="background:conic-gradient(' + parts + ')"><div class="c"><b>' + c + '</b><span>' + esc(top.n) + '</span></div></div>';
}
function legend(segs){
  return '<div class="legend">' + segs.map(s => '<div class="li"><i style="background:' + s.c + '"></i>' + esc(s.n) + '<b class="pct num">' + s.v + '%</b></div>').join('') + '</div>';
}
function radar(axes, values, vs){
  const S = 244, C = S / 2, R = 74, n = axes.length;
  const pt = (i, r) => {
    const ang = -Math.PI / 2 + i * 2 * Math.PI / n;
    return [C + Math.cos(ang) * r, C + Math.sin(ang) * r];
  };
  const rings = [0.25, 0.5, 0.75, 1].map(k =>
    '<polygon points="' + axes.map((_, i) => pt(i, R * k).map(v => v.toFixed(1)).join(',')).join(' ') + '" fill="none" stroke="#e8ebf3"/>').join('');
  const spokes = axes.map((a, i) => {
    const [x, y] = pt(i, R); const [lx, ly] = pt(i, R + 20);
    return '<line x1="' + C + '" y1="' + C + '" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="#e8ebf3"/>' +
      '<text x="' + lx.toFixed(1) + '" y="' + (ly + 4).toFixed(1) + '" text-anchor="middle" font-size="10.5" fill="#8a93a6">' + esc(a) + '</text>';
  }).join('');
  const poly = values.map((v, i) => pt(i, R * (v / 100)).map(x => x.toFixed(1)).join(',')).join(' ');
  const comp = vs ? '<polygon points="' + vs.map((v, i) => pt(i, R * (v / 100)).map(x => x.toFixed(1)).join(',')).join(' ') + '" fill="none" stroke="#c3c9d4" stroke-dasharray="4 3"/>' : '';
  return '<svg viewBox="0 0 ' + S + ' ' + S + '" width="' + S + '" height="' + S + '">' + rings + spokes + comp +
    '<polygon points="' + poly + '" fill="rgba(109,74,255,.18)" stroke="#6d4aff" stroke-width="2"/>' +
    values.map((v, i) => { const [x, y] = pt(i, R * (v / 100)); return '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3" fill="#6d4aff"/>'; }).join('') +
    '</svg>';
}

const STEP_META = {
  think:{ic:'✦', cls:'st-think', label:'思考'},
  tool:{ic:'⚙', cls:'st-tool', label:'调用工具'},
  obs:{ic:'✓', cls:'st-obs', label:'观察'},
  out:{ic:'★', cls:'st-out', label:'产出'},
  hitl:{ic:'!', cls:'st-hitl', label:'需人工'}
};
function stepHtml(s){
  const m = STEP_META[s.type] || STEP_META.think;
  let inner = '<div class="st-t">' + esc(s.title) + '</div>';
  if(s.desc) inner += '<div class="st-d">' + s.desc + '</div>';
  if(s.tool) inner += '<div class="tool-card">' + esc(s.tool) + '</div>';
  if(s.out) inner += '<div class="out-card">' + s.out + '</div>';
  return '<div class="step"><div class="step-ic ' + m.cls + '">' + m.ic + '</div><div class="step-b">' + inner + '</div></div>';
}
function skeletonHtml(){
  return '<div class="step"><div class="step-ic st-think">✦</div><div class="step-b"><div class="shimmer" style="width:42%"></div><div class="shimmer" style="width:74%"></div></div></div>';
}
const TRACE_TOKEN = {};
/** 顺序播放执行轨迹，完成后回调；同一宿主重复播放时旧播放自动失效 */
async function playTrace(hostSel, steps, speed){
  const token = (TRACE_TOKEN[hostSel] || 0) + 1;
  TRACE_TOKEN[hostSel] = token;
  const host = $(hostSel);
  if(!host) return;
  const alive = () => TRACE_TOKEN[hostSel] === token && document.contains(host);
  for(let i = 0; i < steps.length; i++){
    if(!alive()) return;
    host.insertAdjacentHTML('beforeend', skeletonHtml());
    await sleep((speed || 620) + Math.random() * 240);
    if(!alive()) return;
    if(host.lastElementChild && host.lastElementChild.classList.contains('step')) host.removeChild(host.lastElementChild);
    host.insertAdjacentHTML('beforeend', stepHtml(steps[i]));
    host.scrollTop = host.scrollHeight;
  }
}

let cpBusy = false;
function cpMatch(text){
  const t = text.toLowerCase();
  for(const s of CP_SCRIPTS){
    if(s.match.some(k => t.indexOf(k.toLowerCase()) > -1)) return s;
  }
  return null;
}
async function cpAsk(text){
  if(cpBusy) { toast('AI 正在执行上一个任务，稍等一下', 'warn'); return; }
  cpBusy = true;
  CP_HISTORY.push({role:'u', text: text});
  const script = cpMatch(text);
  const traceId = 'trace-' + Date.now();
  if(!script){
    CP_HISTORY.push({role:'a', text: CP_DEFAULT.reply + '<div class="quick">' +
      ['把本月到期的车险续保跑一遍，结果给我审','帮我处理周杰的理赔单证','哪个渠道的 ROI 最高？','给张伟民做一版保障缺口分析','今天双录质检有风险吗'].map(q => '<button data-q="' + esc(q) + '">✦ ' + esc(q) + '</button>').join('') + '</div>'});
    cpRender(); cpBusy = false; return;
  }
  CP_HISTORY.push({role:'a', text: script.reply + (script.steps ? '<div style="font-size:11.5px;color:#8a93a6;margin-top:8px">▾ AI 执行轨迹（可追溯）</div>' : ''), trace: traceId});
  const ansMsg = CP_HISTORY[CP_HISTORY.length - 1];
  cpRender();
  if(script.steps){
    await playTrace('#' + traceId, script.steps, 700);
    const host = $('#' + traceId);
    if(host){ ansMsg.stepsHtml = host.innerHTML; ansMsg.approveHtml = ''; }
  }
  if(script.approval){
    const aid = traceId + '-ap';
    const apHtml = '<div class="approve-card" id="' + aid + '"><div class="t">⚠ ' + script.approval.t + '</div><div class="d">' + script.approval.d + '</div>' +
      '<div class="f"><button class="btn btn-ok btn-sm" data-ap="ok" data-id="' + aid + '">批准执行</button>' +
      '<button class="btn btn-bad btn-sm" data-ap="no" data-id="' + aid + '">驳回 / 转人工</button>' +
      '<button class="btn btn-g btn-sm" data-ap="edit" data-id="' + aid + '">修改后再执行</button></div></div>';
    const host = $('#' + traceId);
    if(host) host.insertAdjacentHTML('beforeend', apHtml);
    ansMsg.stepsHtml = (host ? host.innerHTML : '');
    const sc = $('#cp-b'); sc.scrollTop = sc.scrollHeight;
  }
  cpBusy = false;
}
function bindCopilot(){

let cmdIdx = 0, cmdFiltered = CMD_ITEMS.slice();
function cmdRender(){
  let g = '', html = '';
  cmdFiltered.forEach((it, i) => {
    if(it.g !== g){ g = it.g; html += '<div class="cmdk-g">' + g + '</div>'; }
    html += '<div class="cmdk-i' + (i === cmdIdx ? ' on' : '') + '" data-i="' + i + '"><span class="ic">' + it.ic + '</span><span>' + esc(it.t) + '</span><span class="sub">' + it.sub + '</span></div>';
  });
  if(!cmdFiltered.length) html = '<div class="empty">没有匹配项，按 Enter 直接交给 Copilot 处理</div>';
  $('#cmdk-list').innerHTML = html;
}
function cmdOpen(){
  $('#cmdk').classList.add('show');
  $('#cmdk-in').value = '';
  cmdFiltered = CMD_ITEMS.slice(); cmdIdx = 0; cmdRender();
  setTimeout(() => $('#cmdk-in').focus(), 30);
}
function cmdClose(){ $('#cmdk').classList.remove('show'); }
function cmdRun(i){
  const it = cmdFiltered[i];
  cmdClose();
  if(it) it.run();
  else { const v = $('#cmdk-in').value.trim(); if(v){ toggleCopilot(true); cpSeed(); cpAsk(v); } }
}
function bindCmdk(){
  $('#cmdbar').onclick = cmdOpen;
  $('#kbd-hint').onclick = cmdOpen;
  $('#cmdk').onclick = e => { if(e.target.id === 'cmdk') cmdClose(); };
  $('#cmdk-in').addEventListener('input', e => {
    const v = e.target.value.toLowerCase();
    cmdFiltered = CMD_ITEMS.filter(it => it.t.toLowerCase().indexOf(v) > -1 || it.g.toLowerCase().indexOf(v) > -1 || it.sub.toLowerCase().indexOf(v) > -1);
    cmdIdx = 0; cmdRender();
  });
  $('#cmdk-in').addEventListener('keydown', e => {
    if(e.key === 'ArrowDown'){ e.preventDefault(); cmdIdx = Math.min(cmdIdx + 1, Math.max(cmdFiltered.length - 1, 0)); cmdRender(); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); cmdIdx = Math.max(cmdIdx - 1, 0); cmdRender(); }
    else if(e.key === 'Enter'){ e.preventDefault(); if(cmdFiltered.length) cmdRun(cmdIdx); else { const v = e.target.value.trim(); cmdClose(); if(v){ toggleCopilot(true); cpSeed(); cpAsk(v); } } }
  });
  $('#cmdk-list').addEventListener('click', e => {
    const it = e.target.closest('.cmdk-i');
    if(it) cmdRun(+it.dataset.i);
  });
}

    bindBIActions();
  };
  $$('[data-biq]').forEach(d => d.onclick = () => show(d.dataset.biq));

  bindBIActions();

let roiAuto = ROI_BASE.auto, roiRate = ROI_BASE.rate;
function roiCalc(){
  const hours = ROI_BASE.hours * (roiAuto / ROI_BASE.auto);
  const monthHours = hours * ROI_BASE.days;
  const fte = monthHours / 168;
  const save = monthHours * roiRate;
  const net = save - ROI_BASE.aiCost;
  const roi = save / ROI_BASE.aiCost;
  return {hours, monthHours, fte, save, net, roi};
}

function initApp(){
  applyMode();

  $('#user').onclick = openRoleModal;

  $('#modal-wrap').addEventListener('click', e => { if(e.target.id === 'modal-wrap') closeModal(); });
  $('#preview-btn').onclick = openPhonePreview;
  $('#m-search').onclick = () => { toggleCopilot(true); cpSeed(); setTimeout(() => $('#cp-in').focus(), 260); };
  $('#m-fab').onclick = () => { toggleCopilot(true); cpSeed(); setTimeout(() => $('#cp-in').focus(), 260); };
  $('#m-avatar').onclick = openRoleModal;
  $('#pill-hitl').onclick = () => { nav('ops'); setTimeout(() => { const el = $('#exc-list'); if(el) el.scrollIntoView({behavior:'smooth', block:'center'}); }, 120); };
  setTimeout(() => toast('提示：按 ⌘K / Ctrl+K 唤起 AI 指令中枢，可让 Copilot 直接替你干活', 'ai'), 900);
  // 全局委派：建议书按钮在抽屉里（不在 #view 内），必须挂在 document 上
  document.addEventListener('click', e => {
    const pl = e.target.closest('button[data-mplan]');
    if(pl){ const parts = pl.dataset.mplan.split('-'); openDocDrawer(+parts[0], +parts[1]); }
  });
  document.addEventListener('keydown', e => {
    if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); cmdOpen(); return; }
    if(e.key === 'Escape'){ cmdClose(); closeDrawer(); closeModal(); return; }
    if(e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA'){ e.preventDefault(); cmdOpen(); }
  });
  window.addEventListener('resize', () => {
    const q = new URLSearchParams(location.search).get('mobile');
    if(q === '1' || q === '0') return;
    const m = window.innerWidth <= 900;
    if(m !== MOBILE){ MOBILE = m; applyMode(); route(); }
  });
}

function bindMLead(){

  onView('mlead', e => {

function bindMClaim(){

      '<div class="mkv" style="margin-top:8px"><span class="k">保额</span><span class="v">' + money(c.amount) + '</span></div>' +

    const c = e.target.closest('[data-mq]');
