<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>保E通 · 保险中介数字化系统（演示）</title>
<style>
:root{
  --primary:#2f54eb;--primary-d:#1d39c4;--bg:#f5f6fa;--text:#1f2733;--muted:#86909c;
  --border:#ebedf2;--sidebar-w:236px;--top-h:60px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;min-width:1180px;
}
::selection{background:rgba(47,84,235,.15)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#d4d9e6;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ===== 布局骨架 ===== */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-w);position:fixed;top:0;bottom:0;left:0;z-index:40;
  background:linear-gradient(180deg,#0d1440,#121b52 55%,#0d1440);
  color:#b9c0e4;display:flex;flex-direction:column;
}
.logo{padding:19px 22px;display:flex;gap:11px;align-items:center;border-bottom:1px solid rgba(255,255,255,.08)}
.logo-mark{
  width:36px;height:36px;border-radius:10px;flex:none;
  background:linear-gradient(135deg,#2f54eb,#53a8ff);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;color:#fff;font-size:17px;box-shadow:0 4px 12px rgba(47,84,235,.45);
}
.logo-text b{color:#fff;font-size:16.5px;display:block;letter-spacing:.5px}
.logo-text span{font-size:11px;color:#8f97c4}
.menu{padding:14px 12px;flex:1;overflow-y:auto}
.menu::-webkit-scrollbar{width:5px}
.menu::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15)}
.menu-group{font-size:11px;color:#66709f;padding:13px 12px 6px;letter-spacing:1px}
.menu-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;
  color:#b9c0e4;cursor:pointer;margin-bottom:2px;font-size:13.5px;transition:.18s;position:relative;
}
.menu-item svg{width:17px;height:17px;flex:none;opacity:.85}
.menu-item:hover{background:rgba(255,255,255,.08);color:#fff}
.menu-item.active{background:rgba(47,84,235,.30);color:#fff;font-weight:600}
.menu-item.active::before{
  content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;
  border-radius:0 3px 3px 0;background:#4a7bff;
}
.side-foot{padding:14px 20px;font-size:11px;color:#5d6590;border-top:1px solid rgba(255,255,255,.08);line-height:1.8}
.main{margin-left:var(--sidebar-w);flex:1;min-width:0}

/* ===== 顶部栏 ===== */
.topbar{
  height:var(--top-h);background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;padding:0 24px;
  position:sticky;top:0;z-index:30;
}
.crumbs{color:var(--muted);font-size:13px}
.crumbs b{color:var(--text);font-weight:600}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.search{position:relative}
.search svg{position:absolute;left:11px;top:9.5px;color:#9aa3b2;pointer-events:none}
.search input{
  width:250px;height:34px;border:1px solid var(--border);border-radius:17px;
  padding:0 14px 0 33px;background:#f7f8fc;outline:none;transition:.2s;font-size:13px;color:var(--text);
}
.search input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(47,84,235,.12)}
.bell{
  position:relative;width:36px;height:36px;border-radius:9px;cursor:pointer;color:#5c6675;
  display:flex;align-items:center;justify-content:center;transition:.18s;
}
.bell:hover{background:#f2f4fa;color:var(--primary)}
.bell:active{transform:scale(.92)}
.bell .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:#f5222d;border:2px solid #fff}
.user{display:flex;align-items:center;gap:9px;cursor:pointer;padding:5px 8px;border-radius:9px;transition:.18s}
.user:hover{background:#f2f4fa}
.user:active{transform:scale(.97)}
.avatar{
  width:32px;height:32px;border-radius:50%;flex:none;color:#fff;
  background:linear-gradient(135deg,#2f54eb,#722ed1);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;
}
.user .name{font-size:13px;font-weight:600;line-height:1.3}
.user .role{font-size:11px;color:var(--muted);line-height:1.2}

/* ===== 内容区 ===== */
.content{padding:22px 24px 44px;max-width:1560px}
#view>*{animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.page-head h2{font-size:19px;font-weight:700}
.page-head p{color:var(--muted);font-size:12.5px;margin-top:4px}
.ph-r{display:flex;gap:10px}

/* ===== 卡片与网格 ===== */
.card{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 3px rgba(31,39,51,.04)}
.card-h{padding:15px 18px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-h h3{font-size:14.5px;font-weight:600}
.card-b{padding:14px 18px 18px}
.hint{font-size:12px;color:#9aa3b2;font-weight:400}
.grid{display:grid;gap:16px}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid-2{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr)}
.grid-2b{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-p5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1200px){
  .grid-4,.grid-p5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-2,.grid-2b{grid-template-columns:minmax(0,1fr)}
}

/* ===== KPI 卡片 ===== */
.kpi{padding:18px;display:flex;gap:14px;align-items:flex-start;transition:.2s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(31,39,51,.09)}
.kpi-ic{width:42px;height:42px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center}
.kpi-ic svg{width:21px;height:21px}
.ic-blue{background:#edf3ff;color:#2f54eb}
.ic-green{background:#f0faf0;color:#2f9e44}
.ic-orange{background:#fff4e6;color:#e8590c}
.ic-purple{background:#f6f0ff;color:#7048e8}
.ic-cyan{background:#e6fcf9;color:#0c8599}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:700;margin:3px 0 7px;letter-spacing:.2px}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:11px}
.delta.good{background:#f0faf0;color:#2f9e44}
.delta.bad{background:#fff0f0;color:#e03131}

/* ===== 统计条 ===== */
.stat{background:#fff;border:1px solid var(--border);border-radius:10px;padding:13px 16px;box-shadow:0 1px 3px rgba(31,39,51,.04)}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-size:19px;font-weight:700;margin-top:3px}
.stat-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}

/* ===== 表格 ===== */
table{width:100%;border-collapse:collapse}
th{background:#f8f9fd;color:#6b7280;font-weight:500;text-align:left;padding:10px 14px;font-size:12.5px;white-space:nowrap}
td{padding:12px 14px;border-top:1px solid #f0f2f7;font-size:13px;vertical-align:middle}
tbody tr{transition:.15s}
.tbl-hover tbody tr:hover{background:#f6f8ff}
tr.clickable{cursor:pointer}
.table-wrap{overflow-x:auto}
.num{font-variant-numeric:tabular-nums}
.empty{text-align:center;color:#9aa3b2;padding:30px !important}
.mini th{padding:8px 10px;font-size:12px}
.mini td{padding:9px 10px;font-size:12.5px}
.pay{color:var(--primary);font-weight:700}

/* ===== 徽章 ===== */
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;line-height:18px;white-space:nowrap}
.b-green{background:#f0faf0;color:#2f9e44}
.b-red{background:#fff0f0;color:#e03131}
.b-blue{background:#edf3ff;color:#2f54eb}
.b-gray{background:#f3f4f6;color:#6b7280}
.b-orange{background:#fff4e6;color:#e8590c}
.b-dark{background:#ececf4;color:#494960}
.insurer{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.insurer i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.tag-p{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:5px;margin:1px 3px 1px 0;white-space:nowrap}
.tp{background:#f6f0ff;color:#7048e8}
.to{background:#fff4e6;color:#e8590c}
.tg{background:#f0faf0;color:#2f9e44}
.tb{background:#edf3ff;color:#2f54eb}
.tag-s{font-size:11px;padding:1.5px 7px;border-radius:4px;margin-right:7px;white-space:nowrap}

/* ===== 按钮 ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 15px;
  border-radius:8px;border:1px solid transparent;font-size:13px;cursor:pointer;transition:.16s;
  font-family:inherit;white-space:nowrap;
}
.btn-p{background:var(--primary);color:#fff}
.btn-p:hover{background:var(--primary-d);transform:translateY(-1px);box-shadow:0 4px 10px rgba(47,84,235,.30)}
.btn-p:active{transform:scale(.96)}
.btn-g{background:#fff;border-color:#dde1ea;color:#3d4657}
.btn-g:hover{border-color:var(--primary);color:var(--primary)}
.btn-g:active{transform:scale(.96)}
.btn-sm{height:28px;padding:0 11px;font-size:12px}
.btn[disabled]{opacity:.65;cursor:default;transform:none !important;box-shadow:none !important}

/* ===== 筛选栏 ===== */
.filter-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.inp,.sel{
  height:34px;border:1px solid #dde1ea;border-radius:8px;padding:0 12px;font-size:13px;
  outline:none;background:#fff;color:#3d4657;transition:.15s;font-family:inherit;
}
.sel{cursor:pointer;padding-right:8px}
.inp:focus,.sel:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(47,84,235,.12)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  padding:6px 14px;border-radius:18px;background:#fff;border:1px solid #dde1ea;
  font-size:12.5px;cursor:pointer;color:#4b5563;transition:.15s;
}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}

/* ===== 环形图 ===== */
.donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.donut{width:158px;height:158px;border-radius:50%;position:relative;flex:none}
.donut::after{content:'';position:absolute;inset:27px;background:#fff;border-radius:50%;box-shadow:inset 0 0 0 1px #f0f2f7}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1}
.donut .c b{font-size:21px}
.donut .c span{font-size:12px;color:#8a93a6;margin-top:2px}
.legend{display:flex;flex-direction:column;gap:9px;font-size:12.5px;flex:1;min-width:150px}
.legend .li{display:flex;align-items:center;gap:8px}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}
.legend .pct{margin-left:auto;color:#6b7280}
.legend-h{display:flex;gap:14px;font-size:12px;color:#6b7280;flex-wrap:wrap}
.legend-h .li{display:flex;align-items:center;gap:5px}
.legend-h i{width:9px;height:9px;border-radius:3px}

/* ===== 待办 ===== */
.todo{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed #eef0f5}
.todo:last-child{border-bottom:none}
.todo-c{
  width:19px;height:19px;border-radius:50%;border:1.5px solid #c6ccda;flex:none;cursor:pointer;
  margin-top:1px;transition:.15s;position:relative;
}
.todo-c:hover{border-color:var(--primary)}
.todo.done .todo-c{background:var(--primary);border-color:var(--primary)}
.todo.done .todo-c::after{
  content:'';position:absolute;left:5px;top:4.5px;width:6px;height:3.5px;
  border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg);
}
.todo.done .tx{color:#9aa3b2;text-decoration:line-through}
.todo .tx{font-size:13px;line-height:1.65}

/* ===== AI ===== */
.ai-card{background:linear-gradient(135deg,#f4f6ff,#faf5ff);border-color:#e3e6fb}
.ai-p{font-size:13px;line-height:1.95;color:#3d4657;text-align:justify}
.ai-badge{
  background:linear-gradient(90deg,#2f54eb,#722ed1);color:#fff;font-size:11px;
  padding:2.5px 9px;border-radius:5px;letter-spacing:.5px;white-space:nowrap;
}
.ai-banner{
  display:flex;align-items:center;gap:12px;padding:13px 18px;margin-bottom:16px;
  background:linear-gradient(90deg,#eef2ff,#f8f0ff);border-color:#dfe5fb;font-size:13px;
}
.ai-banner>div{flex:1;line-height:1.7}
.ai-advice{background:#f4f6ff;border:1px solid #dfe5fb;border-radius:10px;padding:14px;margin-top:18px}
.ai-advice p{font-size:13px;line-height:1.85;margin-top:9px;color:#3d4657}

/* ===== 续保 ===== */
.rn-group{margin-bottom:20px}
.rn-title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;margin:0 0 11px 2px}
.rn-dot{width:9px;height:9px;border-radius:50%;flex:none}
.rn-item{
  display:flex;align-items:center;gap:16px;padding:13px 16px;border:1px solid var(--border);
  border-left:4px solid;border-radius:10px;background:#fff;margin-bottom:10px;transition:.18s;flex-wrap:wrap;
}
.rn-item:hover{box-shadow:0 4px 14px rgba(31,39,51,.08);transform:translateY(-1px)}
.rn-red{border-left-color:#e03131}
.rn-orange{border-left-color:#e8590c}
.rn-gray{border-left-color:#adb5bd}
.rn-main{width:180px;flex:none}
.rn-main .rn-no{display:block;font-size:12px;color:#9aa3b2;margin:2px 0}
.rn-sub{font-size:12.5px;color:#5c6675}
.rn-date{width:92px;flex:none;text-align:center;font-size:13px;font-weight:600}
.rn-date div:last-child{font-size:11px;color:#9aa3b2;font-weight:400;margin-top:2px}
.rn-cond{flex:1;min-width:230px;font-size:12px;line-height:1.75;color:#5c6675;display:flex;flex-direction:column}
.rn-cond b{color:#3d4657;font-size:12.5px}
.rn-note{color:#9aa3b2}

/* ===== 评分条 ===== */
.score{display:flex;align-items:center;gap:8px}
.score-track{width:66px;height:6px;border-radius:3px;background:#eef0f5;overflow:hidden;flex:none}
.score-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#2f54eb,#53a8ff);transition:.3s}
.score-fill.hot{background:linear-gradient(90deg,#e03131,#f08c00)}
.score-fill.cold{background:#c3c9d4}

/* ===== 渠道条形图 ===== */
.cv-row{display:grid;grid-template-columns:110px 1fr 58px;align-items:center;gap:12px;margin-bottom:13px;font-size:13px}
.cv-row:last-child{margin-bottom:0}
.cv-track{height:14px;background:#f0f2f7;border-radius:7px;overflow:hidden}
.cv-fill{height:100%;border-radius:7px;background:linear-gradient(90deg,#53a8ff,#2f54eb);transition:width .6s}
.cv-row:hover .cv-fill{filter:brightness(1.1)}
.cv-val{text-align:right}

/* ===== 利润 ===== */
.pcard{padding:15px 18px}
.pcard .l{font-size:12px;color:var(--muted)}
.pcard .v{font-size:19px;font-weight:700;margin-top:5px}
.pcard.ok{background:#f0faf0;border-color:#cdeed3}
.pcard.ok .v{color:#2b8a3e}
.pf-chart{display:flex;align-items:flex-end;justify-content:space-around;gap:20px;height:236px;padding:28px 10px 0;border-bottom:1px solid #eef0f5}
.pf-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.pf-bar{width:64px;border-radius:8px 8px 0 0;position:relative;transition:.2s;min-height:12px}
.pf-bar:hover{filter:brightness(1.07)}
.pf-bar span{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:600;white-space:nowrap;color:#3d4657}
.pf-name{font-size:12px;color:#6b7280;margin-top:9px;text-align:center}
.pf-formula{margin-top:14px;font-size:12.5px;color:#6b7280;background:#f8f9fd;border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.7}

/* ===== 工作量 ===== */
.wl-row{display:grid;grid-template-columns:76px 1fr 56px;align-items:center;gap:12px;margin-bottom:13px;font-size:13px}
.wl-row:last-child{margin-bottom:0}
.wl-track{display:flex;height:20px;border-radius:6px;overflow:hidden;background:#f0f2f7}
.wl-seg{height:100%;transition:.2s}
.wl-seg:hover{filter:brightness(1.12)}
.wl-t{font-size:12px;color:#6b7280;text-align:right}

/* ===== 抽屉 ===== */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);opacity:0;pointer-events:none;transition:.25s;z-index:60}
.overlay.show{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:450px;max-width:93vw;background:#fff;z-index:70;
  transform:translateX(106%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(15,23,42,.12);
}
.drawer.show{transform:none}
.drawer-h{padding:17px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px}
.drawer-title{font-size:15px;font-weight:700;line-height:1.5}
.drawer-b{padding:18px 20px;overflow-y:auto;flex:1}
.drawer-f{padding:13px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.x-btn{
  width:30px;height:30px;border-radius:8px;border:none;background:#f3f4f8;color:#5c6675;
  cursor:pointer;font-size:14px;transition:.15s;flex:none;
}
.x-btn:hover{background:#e7e9f2;color:var(--text)}
.x-btn:active{transform:scale(.92)}
.d-name{font-size:18px;font-weight:700}
.d-meta{font-size:12px;color:#8a93a6;font-weight:400;margin-left:9px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 18px}
.info-grid .it{font-size:13px;line-height:1.5}
.info-grid .k{color:#8a93a6;font-size:12px;margin-bottom:2px}
.sec-t{font-size:13.5px;font-weight:600;margin:20px 0 11px;display:flex;align-items:center;gap:7px}
.sec-t::before{content:'';width:3px;height:13px;border-radius:2px;background:var(--primary)}
.tl{position:relative;padding-left:21px}
.tl::before{content:'';position:absolute;left:5.5px;top:7px;bottom:7px;width:2px;background:#e8ecf5}
.tl-item{position:relative;padding-bottom:17px}
.tl-item:last-child{padding-bottom:2px}
.tl-item::before{
  content:'';position:absolute;left:-21px;top:4px;width:10px;height:10px;border-radius:50%;
  background:#fff;border:2.5px solid var(--primary);
}
.tl-date{font-size:12px;color:#8a93a6}
.tl-x{font-size:13px;margin-top:3px;line-height:1.65}

/* ===== 弹窗 ===== */
.modal-wrap{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.45);padding:20px}
.modal-wrap.show{display:flex}
.modal{width:540px;max-width:94vw;max-height:88vh;overflow-y:auto;animation:pop .22s}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-h h3{font-size:15px}
.modal-b{padding:18px 20px}
.modal-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field label{display:block;font-size:12px;color:#5c6675;margin-bottom:5px}
.field input,.field select{
  width:100%;height:36px;border:1px solid #dde1ea;border-radius:8px;padding:0 10px;
  font-size:13px;outline:none;font-family:inherit;color:#3d4657;background:#fff;
}

/* 纯 SVG 柱状图 */
function barChart(data){
  const W = 620, H = 230, base = H - 34;
  const max = Math.max.apply(null, data.map(d => d.v)) * 1.15;
  const gap = (W - 56) / data.length;
  const bw = Math.min(36, gap * 0.45);
  const bars = data.map((d, i) => {
    const h = (d.v / max) * (H - 74);
    const x = 44 + i * gap + (gap - bw) / 2, y = base - h;
    return '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + h + '" rx="7" fill="url(#bgGrad)" opacity="' + (i === data.length - 1 ? 1 : 0.72) + '"/>' +
      '<text x="' + (x + bw / 2) + '" y="' + (y - 9) + '" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3d4657">' + d.v + '</text>' +
      '<text x="' + (x + bw / 2) + '" y="' + (H - 12) + '" text-anchor="middle" font-size="12" fill="#8a93a6">' + d.m + '</text>';
  }).join('');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto">' +
    '<defs><linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a7bff"/><stop offset="1" stop-color="#2f54eb"/></linearGradient></defs>' +
    '<line x1="38" y1="' + base + '" x2="' + (W - 12) + '" y2="' + base + '" stroke="#e6e9f2"/>' + bars + '</svg>';
}
/* conic-gradient 环形图 */
function donut(segs){
  let acc = 0;
  const parts = segs.map(s => { const from = acc; acc += s.v; return s.c + ' ' + from + '% ' + acc + '%'; }).join(',');
  const top = segs.slice().sort((a, b) => b.v - a.v)[0];
  return '<div class="donut" style="background:conic-gradient(' + parts + ')"><div class="c"><b>' + top.v + '%</b><span>' + esc(top.n) + '</span></div></div>';
}
function kpi(ic, cls, label, value, delta, dcls){
  return '<div class="card kpi"><div class="kpi-ic ' + cls + '">' + ic + '</div><div><div class="l">' + label + '</div><div class="v num">' + value + '</div><span class="delta ' + dcls + '">' + delta + '</span></div></div>';
}

function rnList(){

}
function rnGroup(title, cls, dot, list){
  if(!list.length) return '';
  return '<div class="rn-group"><div class="rn-title"><span class="rn-dot" style="background:' + dot + '"></span>' + title + '<span class="hint">（' + list.length + ' 件）</span></div>' +
    list.map(r => {
      const c = cust(r.cid);
      const sent = SENT.has(r.no);
      return '<div class="rn-item rn-' + cls + '">' +
        '<div class="rn-main"><b>' + esc(c.name) + '</b><span class="rn-no num">' + esc(r.no) + '</span><div class="rn-sub">' + insBadge(r.ins) + ' · ' + esc(r.type) + '</div></div>' +
        '<div class="rn-date"><div class="num">' + r.end + '</div><div>到期日</div></div>' +
        '<div>' + badge(r.dl <= 0 ? '今日到期' : '剩余 ' + r.dl + ' 天', r.dl <= 7 ? 'b-red' : r.dl <= 30 ? 'b-orange' : 'b-gray') + '</div>' +
        '<div class="rn-cond"><b>上年保费 ' + money(r.prev || r.premium) + '</b><span>' + esc(r.coverage || '保障责任以条款为准') + '</span><span class="rn-note">' + esc(r.note || '') + '</span></div>' +
        (ROLE.write
          ? '<button class="btn btn-sm rn-btn ' + (sent ? 'btn-g' : 'btn-p') + '" data-no="' + r.no + '"' + (sent ? ' disabled' : '') + '>' + (sent ? '✓ 已发送' : '发送提醒') + '</button>'

    $$('.chips .chip').forEach(x => x.classList.toggle('on', x === c));
    $('#lead-tb').innerHTML = leadRows();
  });
  const add = $('#lead-add');
  if(add) add.onclick = openLeadModal;
}

/* ================= 6. 理赔记录 ================= */
let claimSt = '全部';
const CCHIPS = ['全部', '已报案', '审核中', '已结案'];
function claimRows(){
  const list = scopedClaims().filter(x => claimSt === '全部' || x.st === claimSt);
  if(!list.length) return '<tr><td colspan="7" class="empty">暂无匹配理赔记录</td></tr>';
  return list.map(x => '<tr>' +
    '<td class="num" style="font-weight:600">' + esc(x.no) + '</td>' +
    '<td>' + esc(cust(x.cid).name) + '</td>' +
    '<td class="num">' + x.pol + '</td>' +
    '<td>' + insBadge(x.ins) + '</td>' +
    '<td class="num">' + x.date + '</td>' +
    '<td class="num"><b>' + money(x.amt) + '</b></td>' +
    '<td>' + badge(x.st, CST[x.st]) + '</td></tr>').join('');
}
function renderClaims(){
  return head('理赔记录', (ROLE.scope ? '协助本人客户报案与进度跟踪' : '协助客户报案与进度跟踪') + ' · 点击筛选查看不同状态', ROLE.write ? '<button class="btn btn-p" id="claim-add">＋ 登记理赔</button>' : '') +
  roBanner() +
  '<div class="card"><div class="card-b" style="padding-top:16px">' +
    '<div class="chips" style="margin-bottom:14px">' + CCHIPS.map(s => '<span class="chip' + (s === claimSt ? ' on' : '') + '" data-s="' + s + '">' + s + '</span>').join('') + '</div>' +
    '<div class="table-wrap"><table class="tbl-hover"><thead><tr><th>报案号</th><th>客户</th><th>关联保单</th><th>保险公司</th><th>出险日期</th><th>赔付金额</th><th>状态</th></tr></thead><tbody id="claim-tb">' + claimRows() + '</tbody></table></div>' +
  '</div></div>';
}
function bindClaims(){
  $$('.chips .chip').forEach(c => c.onclick = () => {
    claimSt = c.dataset.s;
    $$('.chips .chip').forEach(x => x.classList.toggle('on', x === c));
    $('#claim-tb').innerHTML = claimRows();
  });
  const add = $('#claim-add');
  if(add) add.onclick = openClaimModal;
}

/* ================= 7. 渠道管理 ================= */
function renderChannels(){
  const conv = c => c.deals / c.leads * 100;
  const max = Math.max.apply(null, CHANNELS.map(conv));
  return head('渠道管理', '各渠道线索与转化表现 · 统计周期 2026-09', ROLE.write ? '<button class="btn btn-p" id="ch-add">＋ 新增渠道</button>' : '') +
  roBanner() +
  '<div class="card"><div class="card-b" style="padding-top:16px">' +
    '<div class="table-wrap"><table class="tbl-hover"><thead><tr><th>渠道名称</th><th>线索数</th><th>成交数</th><th>转化率</th><th>贡献保费</th></tr></thead><tbody>' +
    CHANNELS.map(c => '<tr><td><b>' + esc(c.name) + '</b></td><td class="num">' + c.leads + '</td><td class="num">' + c.deals + '</td><td class="num"><b>' + conv(c).toFixed(1) + '%</b></td><td class="num">' + money(c.premium) + '</td></tr>').join('') +
    '</tbody></table></div>' +
  '</div></div>' +
  '<div class="card" style="margin-top:16px"><div class="card-h"><h3>渠道转化率对比</h3><span class="hint">成交数 / 线索数</span></div><div class="card-b">' +
    CHANNELS.map(c => { const v = conv(c); return '<div class="cv-row"><span>' + c.name + '</span><div class="cv-track"><div class="cv-fill" style="width:' + (v / max * 100).toFixed(1) + '%"></div></div><b class="cv-val num">' + v.toFixed(1) + '%</b></div>'; }).join('') +
  '</div></div>';
}
function openChannelModal(){
  openModal('<div class="modal card">' +
    '<div class="modal-h"><h3>新增渠道</h3><button class="x-btn" onclick="closeModal()">✕</button></div>' +
    '<div class="modal-b"><div class="form-grid">' +
      '<div class="field"><label>渠道名称 *</label><input id="nch-name" placeholder="如 银行网点合作"></div>' +
      '<div class="field"><label>本月线索数 *</label><input id="nch-leads" type="number" min="0" placeholder="如 20"></div>' +
      '<div class="field"><label>本月成交数 *</label><input id="nch-deals" type="number" min="0" placeholder="如 3"></div>' +
      '<div class="field"><label>贡献保费（元）</label><input id="nch-premium" type="number" min="0" placeholder="可选"></div>' +
    '</div></div>' +
    '<div class="modal-f"><button class="btn btn-g" onclick="closeModal()">取消</button><button class="btn btn-p" id="nch-submit">提交</button></div></div>');
  $('#nch-submit').onclick = () => {
    const name = $('#nch-name').value.trim();
    const leads = parseInt($('#nch-leads').value, 10);
    const deals = parseInt($('#nch-deals').value, 10);
    const premium = parseFloat($('#nch-premium').value) || 0;
    if(!name || isNaN(leads) || leads <= 0 || isNaN(deals) || deals < 0){ toast('请完整填写渠道信息（线索数需大于 0）', 'warn'); return; }
    if(deals > leads){ toast('成交数不能大于线索数', 'warn'); return; }
    CHANNELS.unshift({name: name, leads: leads, deals: deals, premium: premium});
    closeModal();
    toast('渠道「' + esc(name) + '」创建成功（演示）');
    nav('channels');
  };
}
function bindChannels(){ const add = $('#ch-add'); if(add) add.onclick = openChannelModal; }

/* ================= 8. 分成与利润 ================= */
function renderProfit(){
  /* 业务员视角：仅本人分成（公司利润对业务员不可见） */
  if(ROLE.profit === 'self'){
    const e = EMPLOYEES.find(x => x.name === ROLE.scope) || EMPLOYEES[0];
    const pay = Math.round((e.fc + e.rc) * e.k);
    return head('我的分成', '业务员仅可查看本人分成明细，公司利润对业务员不可见') +
    '<div class="card"><div class="card-h"><h3>我的分成明细（2026-09）</h3><span class="hint">实发 =（首佣 + 续佣）× 考核系数</span></div><div class="card-b">' +
      '<div class="table-wrap"><table class="tbl-hover"><thead><tr><th>业务员</th><th>角色</th><th>本月保费</th><th>首年佣金</th><th>续期佣金</th><th>考核系数</th><th>实发分成合计</th></tr></thead><tbody>' +
        '<tr><td><b>' + esc(e.name) + '</b></td><td>' + esc(e.role) + '</td><td class="num">' + money(e.month) + '</td><td class="num">' + money(e.fc) + '</td><td class="num">' + money(e.rc) + '</td><td class="num">× ' + e.k.toFixed(2) + '</td><td class="num pay">' + money(pay) + '</td></tr>' +
      '</tbody></table></div>' +
    '</div></div>' +
    '<div class="grid grid-2b" style="margin-top:16px">' +
      '<div class="card pcard"><div class="l">我的本月保费</div><div class="v num">' + money(e.month) + '</div></div>' +
      '<div class="card pcard ok"><div class="l">我的实发分成（2026-09）</div><div class="v num">' + money(pay) + '</div></div>' +
    '</div>' +
    '<div class="ai-banner card" style="margin-top:16px"><span class="ai-badge">提示</span><div>公司利润、其他业务员分成等经营数据仅「系统管理员 / 财务专员」可见，当前角色为「' + ROLE.urole + '」</div></div>';
  }
  const payout = EMPLOYEES.reduce((s, e) => s + Math.round((e.fc + e.rc) * e.k), 0);
  const net = PROFIT.settle - payout - PROFIT.cost;
  const pfBars = [
    ['保司结算佣金', PROFIT.settle, '#2f54eb'],
    ['业务员分成',   payout,        '#fa8c16'],
    ['运营成本',     PROFIT.cost,   '#722ed1'],
    ['本月净利润',   net,           '#2f9e44']
  ];
  return head('分成与利润', '业务员分成核算与公司月度利润测算', '<button class="btn btn-g" id="pf-exp">导出报表</button>') +
  '<div class="card"><div class="card-h"><h3>业务员分成表（2026-09）</h3><span class="hint">实发 =（首佣 + 续佣）× 考核系数</span></div><div class="card-b">' +
    '<div class="table-wrap"><table class="tbl-hover"><thead><tr><th>业务员</th><th>角色</th><th>本月保费</th><th>首年佣金</th><th>续期佣金</th><th>考核系数</th><th>实发分成合计</th></tr></thead><tbody>' +
    EMPLOYEES.map(e => { const pay = Math.round((e.fc + e.rc) * e.k); return '<tr><td><b>' + esc(e.name) + '</b></td><td>' + esc(e.role) + '</td><td class="num">' + money(e.month) + '</td><td class="num">' + money(e.fc) + '</td><td class="num">' + money(e.rc) + '</td><td class="num">× ' + e.k.toFixed(2) + '</td><td class="num pay">' + money(pay) + '</td></tr>'; }).join('') +
    '</tbody></table></div>' +
  '</div></div>' +
  '<div class="grid grid-p5" style="margin-top:16px">' +
    '<div class="card pcard"><div class="l">月总保费</div><div class="v num">' + money(PROFIT.premium) + '</div></div>' +
    '<div class="card pcard"><div class="l">保司结算佣金（18.0%）</div><div class="v num">' + money(PROFIT.settle) + '</div></div>' +
    '<div class="card pcard"><div class="l">业务员分成合计</div><div class="v num">' + money(payout) + '</div></div>' +
    '<div class="card pcard"><div class="l">运营成本</div><div class="v num">' + money(PROFIT.cost) + '</div></div>' +
    '<div class="card pcard ok"><div class="l">本月净利润</div><div class="v num">' + money(net) + '</div></div>' +
  '</div>' +
  '<div class="card" style="margin-top:16px"><div class="card-h"><h3>公司利润构成</h3><span class="hint">单位：元</span></div><div class="card-b">' +
    '<div class="pf-chart">' + pfBars.map(b => '<div class="pf-col"><div class="pf-bar" style="height:' + Math.max(b[1] / PROFIT.settle * 100, 5).toFixed(1) + '%;background:' + b[2] + '"><span>' + money(b[1]) + '</span></div><div class="pf-name">' + b[0] + '</div></div>').join('') + '</div>' +
    '<div class="pf-formula">结算佣金 ' + money(PROFIT.settle) + ' － 业务员分成 ' + money(payout) + ' － 运营成本 ' + money(PROFIT.cost) + ' ＝ 净利润 <b>' + money(net) + '</b><span class="ai-badge" style="margin-left:auto">演示数据</span></div>' +
  '</div></div>';
}
function bindProfit(){ $('#pf-exp').onclick = () => toast('演示环境：利润报表已导出（模拟数据）'); }

/* ================= 9. 员工工作量 ================= */
const WLM = [['新增承保','#2f54eb'],['续保处理','#53a8ff'],['跟进次数','#722ed1'],['资料归档','#13c2c2'],['理赔协助','#fa8c16']];
function renderWorkload(){
  const wlRo = !ROLE.write || ROLE.key === 'ops';
  return head('员工工作量', '今日各项业务处理量统计 · 2026-09-22', wlRo ? '' : '<button class="btn btn-g" id="wl-exp">导出报表</button>') +
  (wlRo ? roBanner() : '') +
  '<div class="card"><div class="card-b" style="padding-top:16px">' +
    '<div class="table-wrap"><table class="tbl-hover"><thead><tr><th>姓名</th><th>今日新增承保</th><th>续保处理</th><th>跟进次数</th><th>资料归档</th><th>理赔协助</th><th>合计</th></tr></thead><tbody>' +
    EMPLOYEES.map(e => { const t = e.newBiz + e.renew + e.follow + e.archive + e.claim; return '<tr><td><b>' + e.name + '</b> <span class="hint">' + e.role + '</span></td><td class="num">' + e.newBiz + '</td><td class="num">' + e.renew + '</td><td class="num">' + e.follow + '</td><td class="num">' + e.archive + '</td><td class="num">' + e.claim + '</td><td class="num"><b>' + t + '</b></td></tr>'; }).join('') +
    '</tbody></table></div>' +
  '</div></div>' +
  '<div class="card" style="margin-top:16px"><div class="card-h"><h3>人均工作量分布</h3><div class="legend-h">' + WLM.map(w => '<span class="li"><i style="background:' + w[1] + '"></i>' + w[0] + '</span>').join('') + '</div></div><div class="card-b">' +
    EMPLOYEES.map(e => {
      const t = e.newBiz + e.renew + e.follow + e.archive + e.claim;
      const vals = [e.newBiz, e.renew, e.follow, e.archive, e.claim];
      const segs = vals.map((v, i) => v > 0 ? '<div class="wl-seg" style="width:' + (v / t * 100).toFixed(1) + '%;background:' + WLM[i][1] + '" title="' + WLM[i][0] + '：' + v + ' 件"></div>' : '').join('');
      return '<div class="wl-row"><b>' + e.name + '</b><div class="wl-track">' + segs + '</div><span class="num wl-t">' + t + ' 件</span></div>';
    }).join('') +
  '</div></div>';
}
function bindWorkload(){ const b = $('#wl-exp'); if(b) b.onclick = () => toast('演示环境：工作量报表已导出（模拟数据）'); }

/* ================= 路由与导航 ================= */
const MENUS = [
  {id:'dashboard', name:'经营驾驶舱', icon:I.dash,   group:'工作台'},
  {id:'crm',       name:'客户管理',   icon:I.users,  group:'业务管理'},
  {id:'policies',  name:'承保清单',   icon:I.file,   group:'业务管理'},
  {id:'renewals',  name:'续保提醒',   icon:I.clock,  group:'业务管理'},
  {id:'leads',     name:'未成交跟进', icon:I.target, group:'业务管理'},
  {id:'claims',    name:'理赔记录',   icon:I.shield, group:'业务管理'},
  {id:'channels',  name:'渠道管理',   icon:I.share,  group:'经营管理'},
  {id:'profit',    name:'分成与利润', icon:I.coins,  group:'经营管理'},
  {id:'workload',  name:'员工工作量', icon:I.case,   group:'经营管理'}
];
const PAGES = {
  dashboard:{n:'经营驾驶舱', r:renderDashboard, b:bindDashboard},
  crm:{n:'客户管理', r:renderCRM, b:bindCRM},
  policies:{n:'承保清单', r:renderPolicies, b:bindPolicies},
  renewals:{n:'续保提醒', r:renderRenewals, b:bindRenewals},
  leads:{n:'未成交跟进', r:renderLeads, b:bindLeads},
  claims:{n:'理赔记录', r:renderClaims, b:bindClaims},
  channels:{n:'渠道管理', r:renderChannels, b:bindChannels},
  profit:{n:'分成与利润', r:renderProfit, b:bindProfit},
  workload:{n:'员工工作量', r:renderWorkload, b:bindWorkload}
};
function nav(id){
  if((location.hash || '#/dashboard') === '#/' + id){ route(); }
  else location.hash = '#/' + id;
}
function route(){
  const raw = (location.hash || '#/dashboard').slice(2);
  const id = (PAGES[raw] && ROLE.menus.indexOf(raw) > -1) ? raw : ROLE.menus[0];
  const p = PAGES[id];
  $$('.menu-item').forEach(m => m.classList.toggle('active', m.dataset.id === id));
  $('#crumb').innerHTML = '工作台&nbsp;/&nbsp;<b>' + p.n + '</b>';
  $('#view').innerHTML = p.r();
  if(p.b) p.b();
  window.scrollTo(0, 0);
}
function buildSidebar(){
  let g = '', html = '';
  MENUS.filter(m => ROLE.menus.indexOf(m.id) > -1).forEach(m => {
    if(m.group !== g){ g = m.group; html += '<div class="menu-group">' + m.group + '</div>'; }
    const label = (m.id === 'profit' && ROLE.profit === 'self') ? '我的分成' : m.name;
    html += '<div class="menu-item" data-id="' + m.id + '">' + m.icon + '<span>' + label + '</span></div>';
  });
  $('#menu').innerHTML = html;
  $('#menu').onclick = e => {
    const it = e.target.closest('.menu-item');
    if(it) location.hash = '#/' + it.dataset.id;
  };
}

/* ================= 角色切换（演示权限） ================= */
function openRoleModal(){
  openModal('<div class="modal card">' +
    '<div class="modal-h"><h3>切换演示角色</h3><button class="x-btn" onclick="closeModal()">✕</button></div>' +
    '<div class="modal-b" style="padding-top:14px">' +
      Object.keys(ROLES).map(k => {
        const r = ROLES[k];
        return '<div class="role-opt' + (k === roleKey ? ' on' : '') + '" data-k="' + k + '">' +
          '<div class="ra" style="background:' + r.color + '">' + r.avatar + '</div>' +
          '<div style="flex:1"><b>' + r.uname + ' · ' + r.urole + '</b><p>' + r.desc + '</p></div>' +
          '<span class="ro-check">✓</span></div>';
      }).join('') +
      '<div class="hint" style="margin-top:2px">切换后菜单、可见数据范围与操作按钮将按该角色权限即时刷新</div>' +
    '</div></div>');
  $$('.role-opt').forEach(o => o.onclick = () => setRole(o.dataset.k));
}
function setRole(k){
  roleKey = k;
  ROLE = ROLES[k];
  $('#u-avatar').textContent = ROLE.avatar;
  $('#u-avatar').style.background = ROLE.color;
  $('#u-name').textContent = ROLE.uname;
  $('#u-role').textContent = ROLE.urole;
  buildSidebar();
  closeDrawer();
  closeModal();
  nav('dashboard');
  toast('已切换为「' + ROLE.uname + ' · ' + ROLE.urole + '」视角，菜单与数据已按权限刷新', 'info');
}

/* ================= 全局事件 ================= */
buildSidebar();
window.addEventListener('hashchange', route);
route();

$('#bell').onclick = () => toast('您有 3 条未读通知：2 张保单即将到期、1 条理赔进度更新', 'info');

$('#g-search').addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;

    const i = $('#crm-q');

      i.value = v;
      $('#crm-tb').innerHTML = crmRows();
      if(v) toast('已按「' + v + '」过滤客户列表', 'info');
    }

});
$('#drawer-close').onclick = closeDrawer;
$('#drawer-overlay').onclick = closeDrawer;
$('#modal-wrap').addEventListener('click', e => { if(e.target.id === 'modal-wrap') closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ closeDrawer(); closeModal(); } });
$('#d-call').onclick = () => toast('演示环境：已模拟拨打电话', 'info');
$('#d-wx').onclick = () => toast('演示环境：微信提醒已发送', 'success');
</script>
